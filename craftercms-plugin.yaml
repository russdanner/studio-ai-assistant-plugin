# This file describes a plugin for use in CrafterCMS
# The version of the format for this file
descriptorVersion: 2

# Describe the plugin
plugin:
  type: site
  id: org.craftercms.aiassistant.studio
  name: AI Assistant for Crafter Studio
  tags:
    - authoring
    - tools
  version:
    major: 1
    minor: 0
    patch: 0
  description: AI Assistant — Studio chat, form control, tools, and autonomous agents (optional CrafterQ RAG tool).
  documentation: "https://raw.githubusercontent.com/craftercms/CrafterQ Studio -plugin/main/README.md"
  website:
    name: AI Assistant Studio Plugin
    url: https://github.com/craftercms/crafterQ-plugin
  media:
    screenshots:
      - title: CrafterQ Studio  Plugin
        description: CrafterCMS CrafterQ Studio  Plugin
        url: "https://raw.githubusercontent.com/craftercms/CrafterQ Studio -plugin/main/.crafter/logo.png"
  developer:
    company:
      name: CrafterCMS
      email: info@craftercms.com
      url: https://craftercms.com
  build:
    id: babeb4b44e6a24b5e0481c6ba97901d0b02716c9
    date: 2024-01-20T00:00:00Z
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  crafterCmsVersions:
    - major: 4
      minor: 2
      patch: 2
  crafterCmsEditions:
    - community
    - enterprise
  parameters:
  installation:
    # Merges into config/studio/administration/site-config-tools.xml so the form engine lists this datasource.
    # See https://docs.craftercms.org/en/4.2/by-role/developer/composable/extensions/resources/form-data-source-plugins.html
    - type: form-datasource
      elementXpath: //datasource/plugin[pluginId='org.craftercms.aiassistant.studio' and name='aiassistant-img-from-url']
      element:
        name: datasource
        children:
          - name: plugin
            children:
              - name: pluginId
                value: org.craftercms.aiassistant.studio
              - name: type
                value: datasource
              - name: name
                value: aiassistant-img-from-url
              - name: filename
                value: main.js
          - name: icon
            children:
              - name: class
                value: fa-link
    - type: preview-app
      parentXpath: //widget[@id='craftercms.components.ToolsPanel']
      elementXpath: //widget[@id='craftercms.components.aiassistant.Helper']
      element:
        name: configuration
        children:
          - name: widgets
            children:
              - name: widget
                attributes:
                  - name: id
                    value: craftercms.components.aiassistant.Helper
                children:
                  - name: plugin
                    attributes:
                      - name: id
                        value: org.craftercms.aiassistant.studio
                      - name: type
                        value: aiassistant
                      - name: name
                        value: components
                      - name: file
                        value: index.js
    - type: preview-app
      parentXpath: //widget[@id='craftercms.components.PreviewToolbar']
      elementXpath: //widget[@id='craftercms.components.aiassistant.Helper'][.//plugin[@id='org.craftercms.aiassistant.studio']]
      element:
        name: configuration
        children:
          - name: middleSection
            children:
              - name: widgets
                children:
                  - name: widget
                    attributes:
                      - name: id
                        value: craftercms.components.aiassistant.Helper
                    children:
                      - name: plugin
                        attributes:
                          - name: id
                            value: org.craftercms.aiassistant.studio
                          - name: type
                            value: aiassistant
                          - name: name
                            value: components
                          - name: file
                            value: index.js
                      # Remote chat images import using the current preview page content type's image datasource repoPath
                      # (crafterq-img-from-url, img-desktop-upload, or merged allowImageUpload from image-picker fields).
                      - name: configuration
                        attributes:
                          - name: ui
                            value: IconButton
                        children:
                          # Optional: multiple agents. <llm>crafterQ</llm> = remote hosted chat (api.crafterq.ai); <llm>openAI</llm> = Spring AI + CMS tools.
                          # OpenAI: prefer OPENAI_API_KEY or JVM crafter.openai.apiKey on Studio. Optional <llmModel>; optional <imageModel> for GenerateImage (e.g. gpt-image-1; obsolete dall-e-* in old configs maps to gpt-image-1) — no server default.
                          # Testing only (not recommended): <openAiApiKey> on the agent — used only if env/JVM key unset. See docs/using-and-extending/llm-configuration.md.
                          # <openAsPopup>true</openAsPopup> = floating dialog; omitted or false = Experience Builder right (ICE) panel + edit mode on.
                          # Full fragment reference: docs/examples/studio-ui-aiassistant-fragments.xml
                          - name: agents
                            children:
                              - name: agent
                                children:
                                  - name: crafterQAgentId
                                    value: "019c7237-478b-7f98-9a5c-87144c3fb010"
                                  - name: label
                                    value: Authoring Assistant
                                  - name: llm
                                    value: crafterQ
                                  - name: icon
                                    value: >-
                                      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><title>ai</title><g id="Layer_2" data-name="Layer 2"><g id="invisible_box" data-name="invisible box"><rect width="48" height="48" fill="none"/></g><g id="Q3_icons" data-name="Q3 icons"><g><path fill="currentColor" d="M45.6,18.7,41,14.9V7.5a1,1,0,0,0-.6-.9L30.5,2.1h-.4l-.6.2L24,5.9,18.5,2.2,17.9,2h-.4L7.6,6.6a1,1,0,0,0-.6.9v7.4L2.4,18.7a.8.8,0,0,0-.4.8v9H2a.8.8,0,0,0,.4.8L7,33.1v7.4a1,1,0,0,0,.6.9l9.9,4.5h.4l.6-.2L24,42.1l5.5,3.7.6.2h.4l9.9-4.5a1,1,0,0,0,.6-.9V33.1l4.6-3.8a.8.8,0,0,0,.4-.7V19.4h0A.8.8,0,0,0,45.6,18.7Zm-5.1,6.8H42v1.6l-3.5,2.8-.4.3-.4-.2a1.4,1.4,0,0,0-2,.7,1.5,1.5,0,0,0,.6,2l.7.3h0v5.4l-6.6,3.1-4.2-2.8-.7-.5V25.5H27a1.5,1.5,0,0,0,0-3H25.5V9.7l.7-.5,4.2-2.8L37,9.5v5.4h0l-.7.3a1.5,1.5,0,0,0-.6,2,1.4,1.4,0,0,0,1.3.9l.7-.2.4-.2.4.3L42,20.9v1.6H40.5a1.5,1.5,0,0,0,0,3ZM21,25.5h1.5V38.3l-.7.5-4.2,2.8L11,38.5V33.1h0l.7-.3a1.5,1.5,0,0,0,.6-2,1.4,1.4,0,0,0-2-.7l-.4.2-.4-.3L6,27.1V25.5H7.5a1.5,1.5,0,0,0,0-3H6V20.9l3.5-2.8.4-.3.4.2.7.2a1.4,1.4,0,0,0,1.3-.9,1.5,1.5,0,0,0-.6-2L11,15h0V9.5l6.6-3.1,4.2,2.8.7.5V22.5H21a1.5,1.5,0,0,0,0,3Z"/><path fill="currentColor" d="M13.9,9.9a1.8,1.8,0,0,0,0,2.2l2.6,2.5v2.8l-4,4v5.2l4,4v2.8l-2.6,2.5a1.8,1.8,0,0,0,0,2.2,1.5,1.5,0,0,0,1.1.4,1.5,1.5,0,0,0,1.1-.4l3.4-3.5V29.4l-4-4V22.6l4-4V13.4L16.1,9.9A1.8,1.8,0,0,0,13.9,9.9Z"/><path fill="currentColor" d="M31.5,14.6l2.6-2.5a1.8,1.8,0,0,0,0-2.2,1.8,1.8,0,0,0-2.2,0l-3.4,3.5v5.2l4,4v2.8l-4,4v5.2l3.4,3.5a1.7,1.7,0,0,0,2.2,0,1.8,1.8,0,0,0,0-2.2l-2.6-2.5V30.6l4-4V21.4l-4-4Z"/></g></g></g></svg>
                                  - name: prompts
                                    children:
                                      - name: prompt
                                        value: What can you help me with?
                                      - name: prompt
                                        value: Summarize this page in bullet points
    # Studio AI assistant — autonomous: Tools Panel widget (in-memory state + supervisor; see authoring/scripts/classes/.../autonomous/).
    # Element shape must match Crafter sidebar plugin pattern: configuration → widgets → widget (see CrafterCMS docs plugin-sidebar-example).
    # elementXpath must be under ToolsPanel/configuration/widgets only. A global //widget[...] match wrongly updates a misplaced sibling
    # (direct child of ToolsPanel after </configuration>), which Studio never shows in the sidebar.
    - type: preview-app
      parentXpath: //widget[@id='craftercms.components.ToolsPanel']
      elementXpath: //widget[@id='craftercms.components.ToolsPanel']/configuration/widgets/widget[@id='craftercms.components.aiassistant.AutonomousAssistants'][.//plugin[@id='org.craftercms.aiassistant.studio']]
      element:
        name: configuration
        children:
          - name: widgets
            children:
              - name: widget
                attributes:
                  - name: id
                    value: craftercms.components.aiassistant.AutonomousAssistants
                children:
                  - name: plugin
                    attributes:
                      - name: id
                        value: org.craftercms.aiassistant.studio
                      - name: site
                        value: '{site}'
                      - name: type
                        value: aiassistant
                      - name: name
                        value: components
                      - name: file
                        value: index.js
                  - name: configuration
                    children:
                      - name: title
                        value: Autonomous Agents
                      - name: icon
                        value: >-
                          <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><title>ai</title><g id="Layer_2" data-name="Layer 2"><g id="invisible_box" data-name="invisible box"><rect width="48" height="48" fill="none"/></g><g id="Q3_icons" data-name="Q3 icons"><g><path fill="currentColor" d="M45.6,18.7,41,14.9V7.5a1,1,0,0,0-.6-.9L30.5,2.1h-.4l-.6.2L24,5.9,18.5,2.2,17.9,2h-.4L7.6,6.6a1,1,0,0,0-.6.9v7.4L2.4,18.7a.8.8,0,0,0-.4.8v9H2a.8.8,0,0,0,.4.8L7,33.1v7.4a1,1,0,0,0,.6.9l9.9,4.5h.4l.6-.2L24,42.1l5.5,3.7.6.2h.4l9.9-4.5a1,1,0,0,0,.6-.9V33.1l4.6-3.8a.8.8,0,0,0,.4-.7V19.4h0A.8.8,0,0,0,45.6,18.7Zm-5.1,6.8H42v1.6l-3.5,2.8-.4.3-.4-.2a1.4,1.4,0,0,0-2,.7,1.5,1.5,0,0,0,.6,2l.7.3h0v5.4l-6.6,3.1-4.2-2.8-.7-.5V25.5H27a1.5,1.5,0,0,0,0-3H25.5V9.7l.7-.5,4.2-2.8L37,9.5v5.4h0l-.7.3a1.5,1.5,0,0,0-.6,2,1.4,1.4,0,0,0,1.3.9l.7-.2.4-.2.4.3L42,20.9v1.6H40.5a1.5,1.5,0,0,0,0,3ZM21,25.5h1.5V38.3l-.7.5-4.2,2.8L11,38.5V33.1h0l.7-.3a1.5,1.5,0,0,0,.6-2,1.4,1.4,0,0,0-2-.7l-.4.2-.4-.3L6,27.1V25.5H7.5a1.5,1.5,0,0,0,0-3H6V20.9l3.5-2.8.4-.3.4.2.7.2a1.4,1.4,0,0,0,1.3-.9,1.5,1.5,0,0,0-.6-2L11,15h0V9.5l6.6-3.1,4.2,2.8.7.5V22.5H21a1.5,1.5,0,0,0,0,3Z"/><path fill="currentColor" d="M13.9,9.9a1.8,1.8,0,0,0,0,2.2l2.6,2.5v2.8l-4,4v5.2l4,4v2.8l-2.6,2.5a1.8,1.8,0,0,0,0,2.2,1.5,1.5,0,0,0,1.1.4,1.5,1.5,0,0,0,1.1-.4l3.4-3.5V29.4l-4-4V22.6l4-4V13.4L16.1,9.9A1.8,1.8,0,0,0,13.9,9.9Z"/><path fill="currentColor" d="M31.5,14.6l2.6-2.5a1.8,1.8,0,0,0,0-2.2,1.8,1.8,0,0,0-2.2,0l-3.4,3.5v5.2l4,4v2.8l-4,4v5.2l3.4,3.5a1.7,1.7,0,0,0,2.2,0,1.8,1.8,0,0,0,0-2.2l-2.6-2.5V30.6l4-4V21.4l-4-4Z"/></g></g></g></svg>
                      - name: autonomousAgents
                        children:
                          - name: agent
                            children:
                              - name: name
                                value: Prototype agent
                              # Quartz 6-field: every minute at second 0 (was 0/10 * * * * ? = every 10 seconds — too fast for demos).
                              - name: schedule
                                value: 0 * * * * ?
                              - name: prompt
                                value: You are an autonomous assistant. Reply with JSON only as instructed by the server.
                              - name: scope
                                value: project
                              - name: llm
                                value: openAI
                              - name: llmModel
                                value: gpt-4o-mini
                              - name: imageModel
                                value: gpt-image-1
                              # When false (default), human tasks stay owned by this agent only (max 10); the model cannot dismiss other agents’ tasks.
                              - name: manageOtherAgentsHumanTasks
                                value: false
                              # Optional. Default true: after sync, agent status is waiting (runs when supervisor is on). false: stopped until Start in the widget.
                              # - name: startAutomatically
                              #   value: false
                              # Optional. Default true: failed run sets agent to error until cleared. false: record failure and schedule retry (supervisor keeps running).
                              # - name: stopOnFailure
                              #   value: false
    # Merges into config/studio/administration/site-config-tools.xml so the form engine lists this control in the Content Types builder.
    # See https://docs.craftercms.org/en/4.2/by-role/developer/composable/extensions/resources/form-control-plugins.html
    - type: form-control
      elementXpath: //control/plugin[pluginId='org.craftercms.aiassistant.studio' and name='ai-assistant']
      element:
        name: control
        children:
          - name: plugin
            children:
              - name: pluginId
                value: org.craftercms.aiassistant.studio
              - name: type
                value: control
              - name: name
                value: ai-assistant
              - name: filename
                value: main.js
          - name: icon
            children:
              - name: class
                value: fa-comments
